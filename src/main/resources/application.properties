spring.application.name=secure-messaging-system
# application.properties - Sistema de Mensagens Seguras

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (H2 para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:securemessaging
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (apenas para desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# WebSocket Configuration
spring.websocket.sockjs.heartbeat.time=25000
spring.websocket.sockjs.disconnect.delay=5000

# Logging Configuration
logging.level.mz.ujc.securemessaging=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Crypto Configuration
crypto.rsa.keysize=1024
crypto.aes.keysize=256
crypto.hash.algorithm=SHA-256

# Application Information
spring.application.name=Secure Messaging System
spring.application.version=1.0.0

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Development Profile
spring.profiles.active=development


# Debug para logs
logging.level.org.springframework.web=DEBUG
logging.level.mz.uem.secure_messaging_system=DEBUG