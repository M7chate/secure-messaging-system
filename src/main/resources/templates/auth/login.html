<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title>Login - Sistema de Mensagens Seguras</title>
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --warning-color: #f39c12;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .crypto-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .message-bubble {
            max-width: 85%;
            border-radius: 18px;
            padding: 12px 18px;
            margin-bottom: 12px;
            position: relative;
            animation: fadeInUp 0.3s ease;
            word-wrap: break-word;
        }
        
        .message-sent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .message-received {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin-right: auto;
        }
        
        .online-indicator {
            width: 12px;
            height: 12px;
            background: #27ae60;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }
        
        .online-indicator::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px solid #27ae60;
            border-radius: 50%;
            opacity: 0.6;
            animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        
        @keyframes ping {
            75%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .sidebar {
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .user-card {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .user-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .crypto-info {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Responsividade - Mobile First */
        
        /* Estilos base para mobile */
        @media (max-width: 767.98px) {
            body {
                font-size: 16px;
            }
            
            .crypto-card {
                border-radius: 12px;
                margin: 10px;
            }
            
            /* Login/Register pages */
            .auth-container {
                padding: 20px !important;
                margin: 20px !important;
                max-width: 100% !important;
            }
            
            .auth-title {
                font-size: 2.2rem !important;
            }
            
            .auth-subtitle {
                font-size: 1.1rem !important;
            }
            
            .form-control {
                padding: 15px !important;
                font-size: 16px !important;
                border-radius: 8px !important;
            }
            
            .btn {
                padding: 15px !important;
                font-size: 18px !important;
                border-radius: 8px !important;
            }
            
            /* Dashboard mobile */
            .sidebar {
                position: fixed;
                top: 0;
                left: -100%;
                width: 280px;
                height: 100vh;
                z-index: 1050;
                transition: left 0.3s ease;
                padding-top: 60px;
            }
            
            .sidebar.show {
                left: 0;
            }
            
            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1040;
                display: none;
            }
            
            .sidebar-overlay.show {
                display: block;
            }
            
            .mobile-header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 60px;
                background: rgba(0, 0, 0, 0.2);
                backdrop-filter: blur(10px);
                z-index: 1030;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .main-content-mobile {
                padding-top: 60px;
                height: 100vh;
            }
            
            .user-card {
                padding: 16px;
                margin-bottom: 12px;
            }
            
            .user-card .bi-person-circle {
                font-size: 2.2rem !important;
            }
            
            .online-indicator {
                width: 14px;
                height: 14px;
            }
            
            /* Chat mobile */
            .chat-container {
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            
            .chat-header {
                height: 70px;
                min-height: 70px;
                padding: 15px;
                background: rgba(0, 0, 0, 0.2);
                backdrop-filter: blur(10px);
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .chat-messages {
                flex: 1;
                overflow-y: auto;
                padding: 15px;
                -webkit-overflow-scrolling: touch;
            }
            
            .chat-input {
                height: 80px;
                min-height: 80px;
                padding: 15px;
                background: rgba(0, 0, 0, 0.2);
                backdrop-filter: blur(10px);
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .message-bubble {
                max-width: 85%;
                padding: 15px 18px;
                margin-bottom: 15px;
                font-size: 16px;
            }
            
            /* Navbar mobile */
            .navbar-brand {
                font-size: 1.4rem !important;
            }
            
            .navbar .bi {
                font-size: 1.3rem !important;
            }
        }
        
        /* Tablet */
        @media (min-width: 768px) and (max-width: 991.98px) {
            .crypto-card {
                margin: 15px;
            }
            
            .message-bubble {
                max-width: 75%;
            }
            
            /* Dashboard para tablet */
            .sidebar {
                width: 280px;
            }
            
            .main-content {
                margin-left: 280px;
            }
        }
        
        /* Desktop */
        @media (min-width: 992px) {
            /* Limitar largura do chat no desktop */
            .chat-container-desktop {
                max-width: 1400px;
                margin: 0 auto;
                height: calc(100vh - 76px);
            }
            
            .dashboard-container {
                max-width: 1600px;
                margin: 0 auto;
            }
            
            .auth-container-desktop {
                max-width: 450px;
                margin: 0 auto;
            }
            
            .message-bubble {
                max-width: 65%;
            }
            
            .sidebar {
                width: 320px;
            }
            
            /* Melhor uso do espaço no desktop */
            .crypto-card {
                margin: 20px;
            }
            
            .user-card {
                padding: 12px;
            }
        }
        
        /* Large Desktop */
        @media (min-width: 1200px) {
            .chat-container-desktop {
                max-width: 1600px;
            }
            
            .dashboard-container {
                max-width: 1800px;
            }
            
            .message-bubble {
                max-width: 60%;
            }
        }
        
        /* Input styles for better mobile experience */
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25) !important;
            border-color: rgba(102, 126, 234, 0.5) !important;
        }
        
        /* Ensure text is readable on mobile */
        .text-mobile {
            font-size: 16px !important;
        }
        
        /* Better button sizing */
        .btn-mobile {
            min-height: 48px;
            padding: 12px 20px;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <main layout:fragment="content" class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="crypto-card p-5" style="max-width: 400px; width: 100%;">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-white" style="font-size: 3rem;"></i>
                <h2 class="text-white mt-3">SecureMessage</h2>
                <p class="text-light">Sistema de Mensagens Criptografadas</p>
            </div>
            
            <!-- Alertas -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${error}">Erro</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${message}">Sucesso</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${success}">Sucesso</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label text-light">
                        <i class="bi bi-person me-2"></i>Username
                    </label>
                    <input type="text" class="form-control" id="username" name="username" required 
                           style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label text-light">
                        <i class="bi bi-lock me-2"></i>Password
                    </label>
                    <input type="password" class="form-control" id="password" name="password" required
                           style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
            </form>
            
            <div class="text-center">
                <p class="text-light">Não tem conta? 
                    <a href="/register" class="text-decoration-none" style="color: #67b7ff;">Registre-se aqui</a>
                </p>
            </div>
            
            <div class="crypto-info text-center mt-4">
                <small>
                    <i class="bi bi-shield-check me-1"></i>
                    Protegido com RSA-1024, DH, AES-256 e SHA-256
                </small>
            </div>
        </div>
    </main>
     <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  
</body>
</html>
